plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleanhome.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cleanhome.tv'
        minSdk 34          // the TV runs Android 14
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // The TV is 32-bit ARM; keep only that build of Vosk's native library.
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Offline speech recognition for the remote's voice button.
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
